name: PPIL
defaults:
  - /algorithm/sac@rl
  - _self_

# Deep PPIL reference: expert-centered weights despite ONLINE interaction.
weight_source: expert
loss_type: value_expert
tau: 0.08
inner_steps: 20
regularize: true
chi: false
# Independent coefficients; 0 disables the corresponding penalty.
# Defaults preserve the previous 1/(4*0.5) regularization strength.
# chi additionally penalizes expert rewards using r_reg_coef.
r_reg_coef: 0.5
q_reg_coef: 0.5
reward_lr: 3e-4
actor_betas: [0.9, 0.999]
critic_betas: [0.9, 0.999]
reward_betas: [0.9, 0.999]
actor_update_interval: 1
num_actor_updates: 1

rl:
  double_critic: false
  use_target: false
  buffer_size: 500000
  batch_size: 256
  actor_lr: 3e-5
  critic_lr: 3e-4
  init_temp: 0.01
  learn_temp: false
  update_log_temp: false
  initialize: true
  common_net: true
  log_std_bounds: [-5, 2]
  nstep: 1
