name: SQIL
defaults:
  - /algorithm/sac@rl
  - _self_

# HyPE format: [start_expert_ratio, end_expert_ratio, cumulative_end_update].
# Piecewise linear in completed SAC updates; keep the last ratio afterwards.
# Default preserves 50/50 sampling (MuJoCo lambda_samp=1).
sampling_schedule: [[0.5, 0.5, 1000000]]

# Other SAC parameters inherit the existing sac.yaml defaults.
rl:
  nstep: 1
  batch_size: 256
  learn_temp: true
  update_log_temp: true
  initialize: false
  common_net: false
