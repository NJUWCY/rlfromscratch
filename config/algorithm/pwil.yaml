name: PWIL
defaults:
  - /algorithm/sac@rl
  - _self_

# PWIL Algorithm 1 / Eq. (6); policy optimization uses the existing SAC.
alpha: 5.0
beta: 5.0
time_horizon: ${env.max_episode_length}
observation_only: false
# Repeat selected expert transitions into replay once, with reward alpha.
num_transitions_rb: 50000

rl:
  nstep: 1
  learn_temp: true
  update_log_temp: true
  initialize: false
  common_net: false
