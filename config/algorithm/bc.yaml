name: BC
# auto: TanhGaussianActor for Box, DiscreteProbabilityActor for Discrete.
actor_type: auto
actor_lr: 3e-4
actor_optimizer: Adam
# Coefficient of the L2 penalty l2_coef * sum ||theta||^2 on actor parameters.
l2_coef: 0.0
batch_size: 256
hidden_sizes: [256, 256]
activation: relu
initialize: false
state_dependent_std: true
initial_log_sigma: 0.0
common_net: false
embedding_dim: 512
